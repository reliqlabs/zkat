[package]
name = "record-count-script"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "record-count"
path = "src/main.rs"

[dependencies]
zkat-host = { path = "../../../crates/host" }
record-count-lib = { path = "../lib" }
sp1-sdk = { version = "6.0.2", features = ["blocking"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }

[build-dependencies]
sp1-build = "6.0.2"
