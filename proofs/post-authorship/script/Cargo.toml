[package]
name = "post-authorship-script"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "post-authorship"
path = "src/main.rs"

[dependencies]
zkat-host = { path = "../../../crates/host" }
post-authorship-lib = { path = "../lib" }
sp1-sdk = { version = "6.0.2", features = ["blocking"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
sp1-build = "6.0.2"
