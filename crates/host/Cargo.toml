[package]
name = "zkat-host"
version = "0.1.0"
edition = "2021"

[dependencies]
zkat-core = { path = "../core" }
anyhow = "1"
bs58 = "0.5"
cid = "0.11"
ipld-core = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_ipld_dagcbor = "0.6"
