[workspace]
members = [
    "crates/core",
    "crates/host",
    "proofs/post-contains/lib",
    "proofs/post-contains/program",
    "proofs/post-contains/script",
    "proofs/follows/lib",
    "proofs/follows/program",
    "proofs/follows/script",
    "proofs/liked/lib",
    "proofs/liked/program",
    "proofs/liked/script",
    "proofs/reposted/lib",
    "proofs/reposted/program",
    "proofs/reposted/script",
    "proofs/blocked/lib",
    "proofs/blocked/program",
    "proofs/blocked/script",
    "proofs/list-member/lib",
    "proofs/list-member/program",
    "proofs/list-member/script",
    "proofs/record-authorship/lib",
    "proofs/record-authorship/program",
    "proofs/record-authorship/script",
    "proofs/post-timestamp/lib",
    "proofs/post-timestamp/program",
    "proofs/post-timestamp/script",
    "proofs/post-reply-to/lib",
    "proofs/post-reply-to/program",
    "proofs/post-reply-to/script",
    "proofs/post-mention/lib",
    "proofs/post-mention/program",
    "proofs/post-mention/script",
    "proofs/profile-field/lib",
    "proofs/profile-field/program",
    "proofs/profile-field/script",
    "proofs/selective-disclosure/lib",
    "proofs/selective-disclosure/program",
    "proofs/selective-disclosure/script",
    "proofs/mutual-follow/lib",
    "proofs/mutual-follow/program",
    "proofs/mutual-follow/script",
    "proofs/not-following/lib",
    "proofs/not-following/program",
    "proofs/not-following/script",
    "proofs/record-count/lib",
    "proofs/record-count/program",
    "proofs/record-count/script",
]
resolver = "2"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-6.0.0" }
